<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CrustyHub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--surface:#111;--border:#1e1e1e;--muted:#4a4a4a;--text:#d8d8d8;--tag:#141414}
body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
header{position:relative;z-index:10;padding:3.5rem 2rem 0;text-align:center}
.logo-wrap{display:inline-flex;align-items:center;gap:.9rem}
.logo-icon{width:44px;height:44px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:#fff}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,7vw,5.5rem);letter-spacing:.08em;color:#fff;line-height:1}
.logo span{color:var(--muted)}
.tagline{margin-top:1rem;font-size:.62rem;color:var(--muted);letter-spacing:.35em;text-transform:uppercase}
.stats-bar{display:flex;justify-content:center;gap:2rem;margin-top:1.8rem;padding:.9rem 2rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:.5rem;font-size:.62rem;color:var(--muted);letter-spacing:.15em}
.stat strong{color:#fff;font-size:.75rem}
.search-wrap{position:relative;z-index:10;max-width:560px;margin:2rem auto 0;padding:0 1.5rem}
.search-inner{position:relative}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.search-inner input{width:100%;background:var(--surface);border:1px solid var(--border);border-left:2px solid #fff;color:var(--text);font-family:'Space Mono',monospace;font-size:.75rem;padding:.85rem 1rem .85rem 2.8rem;outline:none;letter-spacing:.05em;transition:border-color .2s,background .2s}
.search-inner input:focus{background:#0f0f0f;border-color:#fff}
.search-inner input::placeholder{color:var(--muted)}
main{position:relative;z-index:10;max-width:1140px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.section-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.section-label h2{display:flex;align-items:center;gap:.5rem;font-size:.62rem;letter-spacing:.3em;color:var(--muted)}
#count{font-size:.62rem;color:var(--muted);letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1px;background:var(--border)}
.card{background:var(--bg);padding:1.6rem;position:relative;overflow:hidden;opacity:0;transform:translateY(10px);animation:fadeUp .35s ease forwards;transition:background .15s}
.card:hover{background:#0d0d0d}
.card::before{content:'';position:absolute;top:0;left:0;width:2px;height:0;background:#fff;transition:height .3s ease}
.card:hover::before{height:100%}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem}
.card-name{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;color:#fff;letter-spacing:.04em;line-height:1.1}
.card-icon{width:32px;height:32px;background:var(--tag);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.card-game{display:inline-flex;align-items:center;gap:.35rem;font-size:.58rem;letter-spacing:.12em;color:var(--muted);background:var(--tag);border:1px solid var(--border);padding:.18rem .55rem;margin-bottom:.8rem;text-transform:uppercase}
.card-desc{font-size:.68rem;color:var(--muted);line-height:1.65;margin-bottom:1rem}
.card-code{background:#0a0a0a;border:1px solid var(--border);padding:.65rem .85rem;font-size:.6rem;color:#666;word-break:break-all;line-height:1.5;margin-bottom:.8rem;position:relative;cursor:pointer;transition:border-color .2s,color .2s}
.card-code:hover{border-color:#444;color:#999}
.copy-hint{position:absolute;top:.35rem;right:.6rem;font-size:.52rem;color:#333;letter-spacing:.08em}
.copied-flash{display:none;position:absolute;inset:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.3);align-items:center;justify-content:center;font-size:.65rem;letter-spacing:.25em;color:#fff}
.card-code.copied .copied-flash{display:flex}
.card-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;padding:.6rem;cursor:pointer;transition:all .18s;text-transform:uppercase}
.card-btn:hover{background:#fff;color:#000;border-color:#fff}
footer{position:relative;z-index:10;border-top:1px solid var(--border);padding:2.5rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.15em;color:var(--muted)}
.footer-link{display:flex;align-items:center;gap:.45rem;font-size:.62rem;letter-spacing:.15em;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:.45rem .9rem;transition:all .18s;text-transform:uppercase}
.footer-link.discord:hover{color:#5865F2;border-color:#5865F2}
.discord-svg{width:13px;height:13px;fill:currentColor}
.footer-note{font-size:.55rem;color:#2a2a2a;letter-spacing:.2em}
.loading-state{grid-column:1/-1;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:.8rem;padding:5rem 0;font-size:.62rem;letter-spacing:.3em;color:var(--muted)}
.spinner{width:14px;height:14px;border:1px solid var(--border);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.error-state{grid-column:1/-1;background:var(--bg);text-align:center;padding:4rem 1rem;font-size:.62rem;color:var(--muted);letter-spacing:.15em}
.no-results{grid-column:1/-1;background:var(--bg);text-align:center;padding:4rem 1rem;font-size:.62rem;color:var(--muted);letter-spacing:.3em}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.stats-bar{gap:1rem}}
</style>
</head>
<body>
<header>
  <div class="logo-wrap">
    <div class="logo-icon"><i data-lucide="terminal" style="width:20px;height:20px"></i></div>
    <div class="logo">CRUSTY<span>HUB</span></div>
  </div>
  <p class="tagline">▸ Roblox Script Collection &nbsp;·&nbsp; Loadstring Ready</p>
  <div class="stats-bar">
    <div class="stat"><i data-lucide="layers" style="width:12px;height:12px"></i>SCRIPTS:&nbsp;<strong id="totalCount">—</strong></div>
    <div class="stat"><i data-lucide="zap" style="width:12px;height:12px"></i>STATUS:&nbsp;<strong>ONLINE</strong></div>
    <div class="stat"><i data-lucide="shield" style="width:12px;height:12px"></i>BYPASS:&nbsp;<strong>ACTIVE</strong></div>
  </div>
</header>
<div class="search-wrap">
  <div class="search-inner">
    <div class="search-icon"><i data-lucide="search" style="width:14px;height:14px"></i></div>
    <input type="text" id="searchInput" placeholder="SEARCH SCRIPTS, GAMES..." autocomplete="off"/>
  </div>
</div>
<main>
  <div class="section-label">
    <h2><i data-lucide="code-2" style="width:11px;height:11px"></i>SCRIPT LIBRARY</h2>
    <span id="count">LOADING...</span>
  </div>
  <div class="grid" id="grid">
    <div class="loading-state"><div class="spinner"></div>FETCHING SCRIPTS</div>
  </div>
</main>
<footer>
  <div class="footer-logo">CRUSTYHUB</div>
  <a href="https://discord.gg/REPLACE_THIS" target="_blank" class="footer-link discord">
    <svg class="discord-svg" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    Discord
  </a>
  <p class="footer-note">USE AT YOUR OWN RISK &nbsp;·&nbsp; ALL SCRIPTS ARE LOADSTRING READY</p>
</footer>
<script>
const JSON_URL='https://raw.githubusercontent.com/platinww/CrustyHub/refs/heads/main/script-lists.json';
const ICONS=['zap','sword','shield','cpu','box','flame','star','target','layers','code','crosshair','activity'];
let allScripts=[];
lucide.createIcons();
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildLS(url){
  url=String(url||'').trim();
  if(!url)return'-- NO URL';
  if(url.startsWith('loadstring'))return url;
  return`loadstring(game:HttpGet("${url}"))()`;
}
function copyText(text,el){navigator.clipboard.writeText(text).then(()=>{if(el){el.classList.add('copied');setTimeout(()=>el.classList.remove('copied'),1500)}})}
function render(scripts){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  grid.innerHTML='';
  if(!scripts.length){grid.innerHTML='<div class="no-results">NO SCRIPTS FOUND</div>';count.textContent='0 SCRIPTS';return}
  count.textContent=scripts.length+' SCRIPT'+(scripts.length!==1?'S':'');
  scripts.forEach((s,i)=>{
    const name=s.name||s.title||'UNKNOWN';
    const desc=s.description||s.desc||'';
    const game=s.game||'';
    const url=s.url||s.rawUrl||s.link||'';
    const ls=buildLS(url);
    const icon=ICONS[i%ICONS.length];
    const card=document.createElement('div');
    card.className='card';
    card.style.animationDelay=Math.min(i*.05,.5)+'s';
    card.innerHTML=`<div class="card-head"><div class="card-name">${esc(name)}</div><div class="card-icon"><i data-lucide="${icon}" style="width:14px;height:14px"></i></div></div>${game?`<div class="card-game"><i data-lucide="gamepad-2" style="width:9px;height:9px"></i>${esc(game)}</div>`:''}${desc?`<div class="card-desc">${esc(desc)}</div>`:''}<div class="card-code" id="cc${i}" onclick="copyText(${JSON.stringify(ls)},this)"><span class="copy-hint">CLICK TO COPY</span><div class="copied-flash">COPIED ✓</div>${esc(ls)}</div><button class="card-btn" onclick="copyText(${JSON.stringify(ls)},document.getElementById('cc${i}'))"><i data-lucide="copy" style="width:11px;height:11px"></i>COPY LOADSTRING</button>`;
    grid.appendChild(card);
  });
  lucide.createIcons();
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  if(!q){render(allScripts);return}
  render(allScripts.filter(s=>[(s.name||''),(s.description||''),(s.game||'')].join(' ').toLowerCase().includes(q)));
});
fetch(JSON_URL)
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(data=>{
    allScripts=Array.isArray(data)?data:(data.scripts||data.data||Object.values(data).find(v=>Array.isArray(v))||[]);
    document.getElementById('totalCount').textContent=allScripts.length;
    render(allScripts);
  })
  .catch(err=>{
    document.getElementById('grid').innerHTML=`<div class="error-state">FAILED TO LOAD SCRIPTS<br/><span style="font-size:.55rem;color:#333;display:block;margin-top:.5rem">${err.message}</span></div>`;
    document.getElementById('count').textContent='ERROR';
    document.getElementById('totalCount').textContent='0';
  });
</script>
</body>
</html>
